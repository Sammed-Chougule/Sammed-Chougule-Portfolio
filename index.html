<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sammed Chougule | Software Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'Arial', sans-serif;
        background-color: #ffffff;
        color: #000;
      }

      .brutal-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-weight: 700;
        text-transform: uppercase;
        background-color: #fff;
        color: #000;
        border: 3px solid #000;
        box-shadow: 5px 5px 0 #000;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        user-select: none;
      }
      .brutal-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: all 0.6s;
      }
      .brutal-btn:hover::before {
        left: 100%;
      }
      .brutal-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0 #000;
      }
      .brutal-btn:active {
        transform: translate(5px, 5px);
        box-shadow: none;
      }
      .brutal-btn--resume:hover {
        background-color: #f43f5e;
        border-color: #f43f5e;
        color: #fff;
        box-shadow: 7px 7px 0 #be123c;
      }
      .brutal-btn--github:hover {
        background-color: #171515;
        border-color: #171515;
        color: #fff;
        box-shadow: 7px 7px 0 #000;
      }
      .brutal-btn--linkedin:hover {
        background-color: #0a66c2;
        border-color: #0a66c2;
        color: #fff;
        box-shadow: 7px 7px 0 #084e94;
      }
      .brutal-btn--solid {
        background-color: #000;
        color: #fff;
      }
      .brutal-btn--solid:hover {
        background-color: #000;
        border-color: #000;
        color: #fff;
        box-shadow: 7px 7px 0 #000;
      }
      .brutal-card {
        border: 3px solid #000;
        background-color: #fff;
        box-shadow: 8px 8px 0 #000;
      }
      .brutal-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.3rem 0.75rem;
        background-color: #fff;
        color: #000;
        border: 2px solid #000;
        box-shadow: 3px 3px 0 #000;
        font-weight: 600;
        font-size: 0.75rem;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      @keyframes gridCellRipple {
        0% {
          opacity: 0.18;
          background-color: rgba(191, 219, 254, 0.15);
        }
        35% {
          opacity: 0.48;
          background-color: rgba(147, 197, 253, 0.35);
        }
        100% {
          opacity: 0.14;
          background-color: rgba(255, 255, 255, 0.2);
        }
      }

      @keyframes fly-1 {
        from {
          transform: translateY(0.1em);
        }
        to {
          transform: translateY(-0.1em);
        }
      }
    </style>

}
</script>
